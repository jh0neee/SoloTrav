<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14161c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      react-native 코드가 기대하는 전역 이름 `global` 을 만들어 둡니다.

      리액트 네이티브에서는 Node 처럼 `global` 이 최상위 객체 이름이지만 브라우저
      에는 없습니다(`window` 입니다). react-native-web 이 리액트 네이티브에서
      그대로 가져다 쓴 코드 몇 군데가 이 이름을 직접 부르는데, 대표적으로
      애니메이션을 멈출 때가 그렇습니다.

        vendor/react-native/Animated/animations/TimingAnimation.js:110
          global.cancelAnimationFrame(this._animationFrame);

      그래서 샛별이 대화의 '입력 중' 점 세 개(ChatBubble)처럼 Animated.loop 을
      쓰는 화면에서 `global is not defined` 로 터집니다. 라이브러리 안쪽이라
      우리가 고칠 수 없고, 번들러가 바꿔치기하기 전에 이미 묶여 있는 코드라
      **앱보다 먼저 실행되는 여기서** 이름을 하나 만들어 주는 것이 가장 확실합니다.

      아래 script 는 모듈이 아니라 일반 스크립트라 main.tsx 보다 먼저 돕니다.
    -->
    <script>
      window.global = window.global || window;
    </script>
    <title>SoloTrav — 혼자 여행하는 사람을 위한 안전한 여행 가이드</title>

    <!--
      한글 본문용 글꼴. 안 받아져도 시스템 글꼴로 자연스럽게 내려갑니다.
      (안드로이드의 Noto Sans KR 과 가장 비슷한 인상을 줍니다)
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
